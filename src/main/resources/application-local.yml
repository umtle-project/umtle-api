# Local development profile (active by default, see application.yml).

spring:
  docker:
    compose:
      file: docker/compose.yaml

# No datasource settings are defined here: the line above starts
# docker/compose.yaml automatically, and Spring Boot's Docker Compose
# service connection wires the datasource for us.
#
# Add other local-only overrides here as they become necessary.

umtle:
  bootstrap-admin:
    login-id: admin
    password: admin-password
